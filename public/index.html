<html lang="it">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<title>CloudCash</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">

<script>try{var d=document.documentElement,t=JSON.parse(localStorage.getItem("theme")),m=JSON.parse(localStorage.getItem("colorMode"));d.dataset.theme=t==="bs5"?"bs5":"gnucash";d.dataset.dark=(m==="yes"||(m==="auto"&&((matchMedia("(prefers-color-scheme: dark)").matches||matchMedia("(prefers-color-scheme: light)").matches)?matchMedia("(prefers-color-scheme: dark)").matches:localStorage.getItem("lastDark")==="1")))?"1":"0"}catch(e){}</script>

<dialog id="dlg"></dialog>
